# BKFT: ARMSX2 builds for the Raspberry Pi 5 console (Batocera 43, 4K-page kernel).
#
#   baseline  — upstream's "Linux arm64 (4k pages)" build settings (ARMv8.1, tests on): the reference for
#               compiler-flag measurements. Our code changes are runtime switches, so with
#               BKFT_PIN_KEEP_CPU0=1 and no BKFT_V3D_* variables it behaves like upstream ARMSX2.
#   pi5       — the console build: ARMv8.2 with the Pi 5's FP16, RCpc and dotprod, scheduled for the
#               Cortex-A76, and without the recompiler test hooks (they sit in the JIT hot path). No
#               crypto extension: BCM2712 lacks it, and code using it would crash there with SIGILL.
#               "-march=" in the flags also stops BuildParameters.cmake from adding its armv8.1-a default.
#   pi5-tests — the same flags with the unit tests built and run, so the console build's compiler
#               settings and our code changes are tested together.
#
# Runs on every push to the bkft-pi5 branch and on demand (Actions → BKFT Pi 5 build → Run workflow).
name: BKFT Pi 5 build

on:
  push:
    branches:
      - bkft-pi5
  workflow_dispatch:

jobs:
  baseline:
    uses: ./.github/workflows/linux_build_qt.yml
    with:
      jobName: "BKFT baseline (Linux arm64, 4k pages)"
      artifactPrefixName: "bkft-baseline-linux-arm64-4k-appimage"
      compiler: clang
      cmakeflags: "-DHOST_PAGE_SIZE=4096 -DHOST_CACHE_LINE_SIZE=64"
      buildAppImage: true

  pi5:
    uses: ./.github/workflows/linux_build_qt.yml
    with:
      jobName: "BKFT pi5 (ARMv8.2 + Cortex-A76 tuning, 4k pages)"
      artifactPrefixName: "bkft-pi5-linux-arm64-4k-appimage"
      compiler: clang
      cmakeflags: "-DHOST_PAGE_SIZE=4096 -DHOST_CACHE_LINE_SIZE=64 -DCMAKE_C_FLAGS=-march=armv8.2-a+fp16+rcpc+dotprod -DCMAKE_CXX_FLAGS=-march=armv8.2-a+fp16+rcpc+dotprod -DARMSX2_ARM64_TUNE=cortex-a76 -DENABLE_TESTS=OFF -DENABLE_RECOMPILER_TEST_HOOKS=OFF"
      buildAppImage: true
      runTests: false

  pi5-tests:
    uses: ./.github/workflows/linux_build_qt.yml
    with:
      jobName: "BKFT pi5 flags + unit tests"
      artifactPrefixName: "bkft-pi5-tests"
      compiler: clang
      cmakeflags: "-DHOST_PAGE_SIZE=4096 -DHOST_CACHE_LINE_SIZE=64 -DCMAKE_C_FLAGS=-march=armv8.2-a+fp16+rcpc+dotprod -DCMAKE_CXX_FLAGS=-march=armv8.2-a+fp16+rcpc+dotprod -DARMSX2_ARM64_TUNE=cortex-a76"
      buildAppImage: false
      runTests: true

  # The CI runners are newer cores (ARMv9), so a binary that uses instructions the Pi 5 lacks would
  # still pass the unit tests there. Disassemble the pi5 build and fail if any such instruction
  # appears: ARMv8 crypto (absent on BCM2712), SVE/SVE2, and ARMv8.3+ instructions outside the
  # hint space (hint-space ones like paciasp/autiasp execute as NOPs on the A76 and are allowed).
  isa-audit:
    name: "BCM2712 instruction audit (pi5)"
    needs: pi5
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download pi5 AppImage
        uses: actions/download-artifact@v8
        with:
          pattern: bkft-pi5-*
          path: art
          merge-multiple: true

      - name: Install disassembler
        run: sudo apt-get -o Acquire::ForceIPv4=true -y install llvm-17 > /dev/null

      - name: Scan for instructions the Cortex-A76 (BCM2712) does not have
        shell: bash
        run: |
          set -euo pipefail
          img=$(ls art/*.AppImage | head -1)
          chmod +x "$img"
          (cd art && "./$(basename "$img")" --appimage-extract > /dev/null)
          # Our own code lives in the main executable; bundled Qt/SDL libraries are built generically.
          bin=$(find art/squashfs-root/usr/bin -maxdepth 1 -type f -executable -size +5M | head -1)
          echo "Scanning: $bin ($(du -h "$bin" | cut -f1))"
          llvm-objdump-17 -d --no-show-raw-insn --no-leading-addr "$bin" > disasm.txt
          echo "Instructions: $(grep -c . disasm.txt)"
          # crypto | SM3/SM4 | SHA3 | BF16/I8MM | v8.3 complex/JS/PAuth (non-hint) | v8.4 RCPC2/flagm | v8.5 frint/flagm2
          bad='^\s*(aes[ed]|aesi?mc|pmull2?|sha1[cmhpsu0-9]*|sha256[hsu0-9]*|sha512[hsu0-9]*|sm3[a-z0-9]*|sm4e[a-z]*|eor3|bcax|rax1|xar|bfcvtn?2?|bfdot|bfmmla|bfmlal[bt]|[su]mmla|usmmla|usdot|sudot|fcmla|fcadd|fjcvtzs|ldraa|ldrab|braa|brab|blraa|blrab|retaa|retab|eretaa|eretab|ldapur[bhsw]*|stlur[bh]?|cfinv|axflag|xaflag|frint(32|64)[xz])\s'
          if grep -E -i "$bad" disasm.txt | sort | uniq -c | sort -rn | head -40 | tee bad.txt | grep -q .; then
            echo "::error::pi5 build contains instructions the Raspberry Pi 5 cannot execute (see list above)"
            exit 1
          fi
          # SVE / SVE2 use z or p registers
          if grep -E -q '\s(z[0-9]+\.[bhsdq]|p[0-9]+(/[mz])?)[,\s]' disasm.txt; then
            grep -E '\s(z[0-9]+\.[bhsdq]|p[0-9]+(/[mz])?)[,\s]' disasm.txt | head -20
            echo "::error::pi5 build contains SVE instructions"
            exit 1
          fi
          echo "OK: no instructions outside the Cortex-A76 / BCM2712 feature set"
