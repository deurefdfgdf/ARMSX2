# BKFT: ARMSX2 builds for the Raspberry Pi 5 console (Batocera 43, 4K-page kernel).
#
#   baseline  — upstream's "Linux arm64 (4k pages)" build settings (ARMv8.1, tests on): the reference for
#               compiler-flag measurements. Our code changes are runtime switches, so with
#               BKFT_PIN_KEEP_CPU0=1 and no BKFT_V3D_* variables it behaves like upstream ARMSX2.
#   pi5       — the console build: ARMv8.2 with the Pi 5's FP16, RCpc and dotprod, scheduled for the
#               Cortex-A76, and without the recompiler test hooks (they sit in the JIT hot path). The
#               BCM2712 also has the Cryptographic Extension; it is left out of -march because the emulator
#               gains nothing from it (LZMA's SHA-256 picks its hardware path at run time anyway).
#               "-march=" in the flags also stops BuildParameters.cmake from adding its armv8.1-a default.
#   pi5-tests — the same flags with the unit tests built and run, so the console build's compiler
#               settings and our code changes are tested together.
#
# PGO: run the workflow by hand with "pgo_generate" ticked to get an instrumented pi5 build
# (bkft-pgo-generate-*). Play it on the Pi with LLVM_PROFILE_FILE set (bench.sh: app=pgo+pgo), commit the
# .profraw files to .github/bkft/pgo/, and from then on the pi5 job is optimised with them.
#
# Runs on every push to the bkft-pi5 branch and on demand (Actions → BKFT Pi 5 build → Run workflow).
name: BKFT Pi 5 build

on:
  push:
    branches:
      - bkft-pi5
  workflow_dispatch:
    inputs:
      pgo_generate:
        description: "Also build the instrumented pi5 binary for collecting a PGO profile on the Pi"
        type: boolean
        default: false

jobs:
  baseline:
    uses: ./.github/workflows/linux_build_qt.yml
    with:
      jobName: "BKFT baseline (Linux arm64, 4k pages)"
      artifactPrefixName: "bkft-baseline-linux-arm64-4k-appimage"
      compiler: clang
      cmakeflags: "-DHOST_PAGE_SIZE=4096 -DHOST_CACHE_LINE_SIZE=64"
      buildAppImage: true

  pi5:
    uses: ./.github/workflows/linux_build_qt.yml
    with:
      jobName: "BKFT pi5 (ARMv8.2 + Cortex-A76 tuning, 4k pages)"
      artifactPrefixName: "bkft-pi5-linux-arm64-4k-appimage"
      compiler: clang
      cmakeflags: "-DHOST_PAGE_SIZE=4096 -DHOST_CACHE_LINE_SIZE=64 -DCMAKE_C_FLAGS=-march=armv8.2-a+fp16+rcpc+dotprod -DCMAKE_CXX_FLAGS=-march=armv8.2-a+fp16+rcpc+dotprod -DARMSX2_ARM64_TUNE=cortex-a76 -DENABLE_TESTS=OFF -DENABLE_RECOMPILER_TEST_HOOKS=OFF"
      buildAppImage: true
      runTests: false
      pgoProfiles: ".github/bkft/pgo"

  pi5-tests:
    uses: ./.github/workflows/linux_build_qt.yml
    with:
      jobName: "BKFT pi5 flags + unit tests"
      artifactPrefixName: "bkft-pi5-tests"
      compiler: clang
      cmakeflags: "-DHOST_PAGE_SIZE=4096 -DHOST_CACHE_LINE_SIZE=64 -DCMAKE_C_FLAGS=-march=armv8.2-a+fp16+rcpc+dotprod -DCMAKE_CXX_FLAGS=-march=armv8.2-a+fp16+rcpc+dotprod -DARMSX2_ARM64_TUNE=cortex-a76"
      buildAppImage: false
      runTests: true

  # The CI runners are newer cores (ARMv9), so a binary that uses instructions the Pi 5 lacks would still
  # pass the unit tests there. Scan the pi5 build's machine code (encoding masks, every hit named by function)
  # and fail on anything the BCM2712 cannot run. Its Cortex-A76 has ARMv8.2-A with FP16, RCpc, dotprod and
  # the Cryptographic Extension; SHA512/SHA3/SM3/SM4, LRCPC2, JSCVT/FCMA, non-hint PAuth, BF16/I8MM, FHM,
  # FlagM, FRINTTS, MTE and SVE/SME are errors. Hint-space PAC (NOPs on the A76) is fine.
  isa-audit:
    name: "BCM2712 instruction audit (pi5)"
    needs: pi5
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout the scanner
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/scripts/bkft

      - name: Download pi5 AppImage
        uses: actions/download-artifact@v8
        with:
          pattern: bkft-pi5-linux-arm64-4k-appimage*
          path: art
          merge-multiple: true

      - name: Scan for instructions the Cortex-A76 (BCM2712) does not have
        shell: bash
        run: |
          set -euo pipefail
          img=$(ls art/*.AppImage | head -1)
          chmod +x "$img"
          (cd art && "./$(basename "$img")" --appimage-extract > /dev/null)
          # Our own code lives in the main executable; bundled Qt/SDL/crypto libraries pick CPU paths at run time.
          bin=$(find art/squashfs-root/usr/bin -maxdepth 1 -type f -executable -size +5M | head -1)
          python3 -I .github/workflows/scripts/bkft/scan_a64.py "$bin" --fail

  pgo-generate:
    if: github.event_name == 'workflow_dispatch' && inputs.pgo_generate
    uses: ./.github/workflows/linux_build_qt.yml
    with:
      jobName: "BKFT pi5 PGO instrumented"
      artifactPrefixName: "bkft-pgo-generate-linux-arm64-4k-appimage"
      compiler: clang
      cmakeflags: "-DHOST_PAGE_SIZE=4096 -DHOST_CACHE_LINE_SIZE=64 -DCMAKE_C_FLAGS=-march=armv8.2-a+fp16+rcpc+dotprod -DCMAKE_CXX_FLAGS=-march=armv8.2-a+fp16+rcpc+dotprod -DARMSX2_ARM64_TUNE=cortex-a76 -DENABLE_TESTS=OFF -DENABLE_RECOMPILER_TEST_HOOKS=OFF -DARMSX2_PGO=generate"
      buildAppImage: true
      runTests: false

  # The instrumented build only helps if it writes a profile that llvm-profdata-17 (the merge step of the
  # pi5 job) can read: start it once headless, let it exit normally and merge what it wrote.
  pgo-smoke:
    name: "PGO instrumented build writes a usable profile"
    needs: pgo-generate
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download instrumented AppImage
        uses: actions/download-artifact@v8
        with:
          pattern: bkft-pgo-generate-*
          path: art
          merge-multiple: true

      - name: Install llvm-profdata
        run: sudo apt-get -o Acquire::ForceIPv4=true -y install llvm-17 > /dev/null

      - name: Run once and merge the profile
        shell: bash
        run: |
          set -euo pipefail
          img=$(ls art/*.AppImage | head -1)
          chmod +x "$img"
          (cd art && "./$(basename "$img")" --appimage-extract > /dev/null)
          export LLVM_PROFILE_FILE="$PWD/prof/armsx2-%m.profraw" QT_QPA_PLATFORM=offscreen
          timeout 60 art/squashfs-root/usr/bin/armsx2-qt -help || true
          ls -la prof
          llvm-profdata-17 merge -o smoke.profdata prof/*.profraw
          llvm-profdata-17 show smoke.profdata | tail -5
